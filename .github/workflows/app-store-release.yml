name: App Store Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action: inspect (read-only), enable_availability (guarded, idempotent), configure (metadata+screenshots) or submit_review"
        required: true
        type: choice
        default: "inspect"
        options:
          - inspect
          - enable_availability
          - configure
          - submit_review

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cryptography pillow

      - name: Read-only ASC and public storefront inspection
        if: ${{ github.event.inputs.action == 'inspect' }}
        run: python3 scripts/asc_readonly_inspection.py
        env:
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_P8_CONTENTS }}

      - name: Enable App Availability for the approved v1.0 release
        id: enable_availability
        continue-on-error: true
        if: ${{ github.event.inputs.action == 'enable_availability' }}
        run: python3 scripts/set_app_availability.py --confirm enable-availability
        env:
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_P8_CONTENTS }}

      - name: Publish evidence on a dedicated branch
        if: ${{ always() && contains(fromJSON('["inspect","enable_availability"]'), github.event.inputs.action) }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "asc-evidence-${GITHUB_RUN_ID}"
          mkdir -p evidence
          if [ ! -f out/asc-inspection.json ]; then
            printf '{"result":"failed","error":"no evidence file was produced by the action step"}\n' > out/asc-inspection.json
          fi
          cp out/asc-inspection.json evidence/asc-inspection.json
          git add evidence/asc-inspection.json
          git commit -m "evidence: action=${{ github.event.inputs.action }} run ${GITHUB_RUN_ID}"
          git push --set-upstream origin "asc-evidence-${GITHUB_RUN_ID}"

      - name: Configure App Store metadata and upload screenshots
        if: ${{ github.event.inputs.action == 'configure' }}
        run: python3 scripts/configure_app_store.py
        env:
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_P8_CONTENTS }}

      - name: Submit for App Store Review
        if: ${{ github.event.inputs.action == 'submit_review' }}
        run: python3 scripts/submit_review.py
        env:
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_P8_CONTENTS }}
