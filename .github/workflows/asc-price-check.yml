name: ASC Price Check (read-only)

on:
  workflow_dispatch:

jobs:
  price-check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cryptography

      - name: Read-only price and localization probe
        run: python3 scripts/asc_price_check.py
        env:
          ASC_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_P8_CONTENTS }}

      - name: Publish evidence on a dedicated branch
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "asc-evidence-${GITHUB_RUN_ID}"
          mkdir -p evidence out
          if [ ! -f out/asc-inspection.json ]; then
            printf '{"result":"failed","error":"no evidence file was produced by the action step"}\n' > out/asc-inspection.json
          fi
          cp out/asc-inspection.json evidence/asc-price-check.json
          git add evidence/asc-price-check.json
          git commit -m "evidence: asc price check run ${GITHUB_RUN_ID}"
          git push --set-upstream origin "asc-evidence-${GITHUB_RUN_ID}"
